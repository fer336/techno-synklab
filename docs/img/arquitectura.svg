<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590" role="img" aria-labelledby="pt pd" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif"><title id="pt">Arquitectura de SYNK//LAB</title><desc id="pd">El navegador reproduce y mezcla; el servidor FastAPI sirve la app y hace de puente; el agente DJ opcional decide cada transición consultando a una CLI de IA.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="context-stroke" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker><style>
.bg{fill:#080b0b}
.zone{fill:rgba(237,241,233,.02);stroke:rgba(237,241,233,.11);stroke-width:.8}
.zl{font:500 8.5px ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;letter-spacing:.14em;fill:#7f8b84}
.n rect{fill:#0f1413;stroke:#3a4640;stroke-width:1}
.n.focal rect{fill:rgba(202,255,26,.08);stroke:#caff1a;stroke-width:1.4}
.n.ext rect,.n.opt rect{stroke-dasharray:4 3}
.n{cursor:default}
.div{stroke:rgba(237,241,233,.10);stroke-width:1}
.nn{font:600 13px system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;fill:#edf1e9}
.ns{font:400 10px ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;fill:#a3aea6}
.e{fill:none;stroke:#7f8b84;stroke-width:1.2}
.e.link{stroke:#8ab4e8}
.e.dash{stroke-dasharray:4 3;stroke-width:1}
.alm{fill:#080b0b}
.al{font:400 9px ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;letter-spacing:.04em;fill:#a3aea6}
.eb{font:500 8.5px ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;letter-spacing:.16em;fill:#7f8b84}
.tit{font:400 22px Georgia,'Times New Roman',serif;fill:#edf1e9}
.sub{font:400 11px ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;fill:#a3aea6}
.note{font:italic 400 13px Georgia,'Times New Roman',serif;fill:#a3aea6}
@media (prefers-reduced-motion:reduce){.tok{display:none}}
ar</style></defs><rect class="bg" width="1000" height="590"/><text class="eb" x="32" y="34">ARQUITECTURA</text><text class="tit" x="32" y="62">Cómo está armado</text><text class="sub" x="32" y="82">Tres piezas locales: la pestaña que suena, el servidor que la acompaña y un agente opcional.</text><rect class="zone" x="24" y="112" width="330" height="452" rx="8"/><rect class="alm" x="36" y="105" width="59" height="14" rx="2"/><text class="zl" x="42" y="115">TU EQUIPO</text><rect class="zone" x="420" y="112" width="290" height="452" rx="8"/><rect class="alm" x="432" y="105" width="102" height="14" rx="2"/><text class="zl" x="438" y="115">CONTENEDOR DOCKER</text><path id="a-ui" class="e link" d="M330,184 H444" marker-end="url(#ah)"/><g class="al-g" data-edge="a-ui"><rect class="alm" x="345.7" y="176" width="82.5" height="14" rx="2"/><text class="al" x="387" y="187" text-anchor="middle">UI + catálogo</text></g><path id="a-poll" class="e link dash" d="M330,220 H444" marker-end="url(#ah)"/><g class="al-g" data-edge="a-poll"><rect class="alm" x="342.9" y="212" width="88.1" height="14" rx="2"/><text class="al" x="387" y="223" text-anchor="middle">poll · eventos</text></g><path id="a-cmd" class="e link" d="M330,307 H444" marker-end="url(#ah)"/><g class="al-g" data-edge="a-cmd"><rect class="alm" x="337.4" y="299" width="99.3" height="14" rx="2"/><text class="al" x="387" y="310" text-anchor="middle">command · events</text></g><path id="a-cli" class="e " d="M189,339 V460" marker-end="url(#ah)"/><g class="al-g" data-edge="a-cli"><rect class="alm" x="147.7" y="392" width="82.5" height="14" rx="2"/><text class="al" x="189" y="403" text-anchor="middle">prompt → JSON</text></g><path id="a-dl" class="e dash" d="M565,410 V460" marker-end="url(#ah)"/><g class="al-g" data-edge="a-dl"><rect class="alm" x="512.6" y="427" width="104.9" height="14" rx="2"/><text class="al" x="565" y="438" text-anchor="middle">opt-in por enlace</text></g><path id="a-mb" class="e " d="M686,196 H770" marker-end="url(#ah)"/><g class="al-g" data-edge="a-mb"><rect class="alm" x="697.9" y="188" width="60.2" height="14" rx="2"/><text class="al" x="728" y="199" text-anchor="middle">metadatos</text></g><path id="a-yt" class="e dash" d="M686,492 H770" marker-end="url(#ah)"/><g class="al-g" data-edge="a-yt"><rect class="alm" x="700.7" y="484" width="54.6" height="14" rx="2"/><text class="al" x="728" y="495" text-anchor="middle">descarga</text></g><g class="n focal" data-id="browser" data-edges="a-ui,a-poll" tabindex="0" role="button" aria-label="Navegador"><rect x="48" y="160" width="282" height="84" rx="6"/><text class="nn" x="60" y="182">Navegador</text><text class="ns" x="60" y="200">SYNK//LAB · Web Audio</text><text class="ns" x="60" y="215">decks · EQ · FX · mezcla</text></g><g class="n focal" data-id="agent" data-edges="a-cmd,a-cli" tabindex="0" role="button" aria-label="Agente DJ"><rect x="48" y="275" width="282" height="64" rx="6"/><text class="nn" x="60" y="297">Agente DJ</text><text class="ns" x="60" y="315">dj_agent.py · decide cada mezcla</text></g><g class="n ext" data-id="cli" data-edges="a-cli" tabindex="0" role="button" aria-label="CLI de IA"><rect x="48" y="460" width="282" height="64" rx="6"/><text class="nn" x="60" y="482">CLI de IA</text><text class="ns" x="60" y="500">claude -p  ·  codex exec</text></g><g class="n" data-id="server" data-edges="a-ui,a-poll,a-cmd,a-dl,a-mb" tabindex="0" role="button" aria-label="Servidor FastAPI"><rect x="444" y="160" width="242" height="250" rx="6"/><text class="nn" x="456" y="182">Servidor FastAPI</text><text class="ns" x="456" y="200">server.py · :8000</text><text class="ns" x="456" y="215">sirve la app · MusicBrainz</text><line class="div" x1="444" y1="262" x2="686" y2="262"/><text class="ns" x="456" y="292">agent_bridge.py</text><text class="ns" x="456" y="307">cola de comandos</text><text class="ns" x="456" y="322">y buffer de eventos</text><line class="div" x1="444" y1="374" x2="686" y2="374"/><text class="ns" x="456" y="396">netguard.py · solo local</text></g><g class="n opt" data-id="dl" data-edges="a-dl,a-yt" tabindex="0" role="button" aria-label="Descargas"><rect x="444" y="460" width="242" height="64" rx="6"/><text class="nn" x="456" y="482">Descargas</text><text class="ns" x="456" y="500">yt-dlp + ffmpeg → Inbox</text></g><g class="n ext" data-id="mb" data-edges="a-mb" tabindex="0" role="button" aria-label="MusicBrainz"><rect x="770" y="168" width="206" height="56" rx="6"/><text class="nn" x="782" y="190">MusicBrainz</text><text class="ns" x="782" y="208">catálogo</text></g><g class="n ext" data-id="yt" data-edges="a-yt" tabindex="0" role="button" aria-label="YouTube · SoundCloud"><rect x="770" y="464" width="206" height="56" rx="6"/><text class="nn" x="782" y="486">YouTube · SoundCloud</text><text class="ns" x="782" y="504">enlaces</text></g><circle class="tok" r="3.6" fill="#caff1a"><animateMotion dur="3.6s" begin="0s" repeatCount="indefinite" calcMode="linear"><mpath href="#a-cmd"/></animateMotion></circle></svg>