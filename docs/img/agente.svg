<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-labelledby="sqt sqd" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif"><title id="sqt">Flujo del agente DJ</title><desc id="sqd">Secuencia: el navegador avisa que un tema termina; el agente lee el estado, consulta a la IA, envía el plan de transición y el mixer la ejecuta.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="context-stroke" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker><style>
.bg{fill:#080b0b}
.zone{fill:rgba(237,241,233,.02);stroke:rgba(237,241,233,.11);stroke-width:.8}
.zl{font:500 8.5px ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;letter-spacing:.14em;fill:#7f8b84}
.n rect{fill:#0f1413;stroke:#3a4640;stroke-width:1}
.n.focal rect{fill:rgba(202,255,26,.08);stroke:#caff1a;stroke-width:1.4}
.n.ext rect,.n.opt rect{stroke-dasharray:4 3}
.n{cursor:default}
.div{stroke:rgba(237,241,233,.10);stroke-width:1}
.nn{font:600 13px system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;fill:#edf1e9}
.ns{font:400 10px ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;fill:#a3aea6}
.e{fill:none;stroke:#7f8b84;stroke-width:1.2}
.e.link{stroke:#8ab4e8}
.e.dash{stroke-dasharray:4 3;stroke-width:1}
.alm{fill:#080b0b}
.al{font:400 9px ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;letter-spacing:.04em;fill:#a3aea6}
.eb{font:500 8.5px ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;letter-spacing:.16em;fill:#7f8b84}
.tit{font:400 22px Georgia,'Times New Roman',serif;fill:#edf1e9}
.sub{font:400 11px ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;fill:#a3aea6}
.note{font:italic 400 13px Georgia,'Times New Roman',serif;fill:#a3aea6}
@media (prefers-reduced-motion:reduce){.tok{display:none}}
.life{stroke:#3a4640;stroke-width:1;stroke-dasharray:3 4}
.badge{fill:#080b0b;stroke:#caff1a;stroke-width:1.2}
.bt{font:600 10px ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;fill:#caff1a}@keyframes m1{0%,3.75%{opacity:0}5.55%,90%{opacity:1}98%,100%{opacity:0}}.msg[data-step="1"]{animation:m1 16.0s linear infinite}@keyframes m2{0%,15.00%{opacity:0}16.80%,90%{opacity:1}98%,100%{opacity:0}}.msg[data-step="2"]{animation:m2 16.0s linear infinite}@keyframes m3{0%,26.25%{opacity:0}28.05%,90%{opacity:1}98%,100%{opacity:0}}.msg[data-step="3"]{animation:m3 16.0s linear infinite}@keyframes m4{0%,41.25%{opacity:0}43.05%,90%{opacity:1}98%,100%{opacity:0}}.msg[data-step="4"]{animation:m4 16.0s linear infinite}@keyframes m5{0%,52.50%{opacity:0}54.30%,90%{opacity:1}98%,100%{opacity:0}}.msg[data-step="5"]{animation:m5 16.0s linear infinite}@keyframes m6{0%,65.00%{opacity:0}66.80%,90%{opacity:1}98%,100%{opacity:0}}.msg[data-step="6"]{animation:m6 16.0s linear infinite}@keyframes m7{0%,77.50%{opacity:0}79.30%,90%{opacity:1}98%,100%{opacity:0}}.msg[data-step="7"]{animation:m7 16.0s linear infinite}@media (prefers-reduced-motion:reduce){.msg{animation:none!important;opacity:1!important}}</style></defs><rect class="bg" width="1000" height="660"/><text class="eb" x="32" y="34">FLUJO DEL AGENTE</text><text class="tit" x="32" y="62">Cómo decide el agente cada mezcla</text><text class="sub" x="32" y="82">Siete mensajes entre la pestaña, el servidor, el agente y la IA.</text><line class="life" x1="130" y1="148" x2="130" y2="640"/><line class="life" x1="370" y1="148" x2="370" y2="640"/><line class="life" x1="630" y1="148" x2="630" y2="640"/><line class="life" x1="880" y1="148" x2="880" y2="640"/><g class="n focal" data-id="s-nav"><rect x="45" y="100" width="170" height="48" rx="6"/><text class="nn" x="57" y="122">Navegador</text><text class="ns" x="57" y="138">mixer</text></g><g class="n " data-id="s-srv"><rect x="285" y="100" width="170" height="48" rx="6"/><text class="nn" x="297" y="122">Servidor</text><text class="ns" x="297" y="138">puente /api/agent</text></g><g class="n focal" data-id="s-agt"><rect x="545" y="100" width="170" height="48" rx="6"/><text class="nn" x="557" y="122">Agente DJ</text><text class="ns" x="557" y="138">dj_agent.py</text></g><g class="n ext" data-id="s-ia"><rect x="795" y="100" width="170" height="48" rx="6"/><text class="nn" x="807" y="122">IA</text><text class="ns" x="807" y="138">claude · codex</text></g><g class="msg" data-step="1"><path class="e link" d="M134,196 H366" marker-end="url(#ah)"/><rect class="alm" x="172.5" y="176" width="155.1" height="14" rx="2"/><text class="al" x="250.0" y="187" text-anchor="middle">POST /event · track_ending</text><circle class="stepdot" cx="134" cy="196" r="0"/></g><g class="msg" data-step="2"><path class="e link dash" d="M374,252 H626" marker-end="url(#ah)"/><rect class="alm" x="428.0" y="232" width="143.9" height="14" rx="2"/><text class="al" x="500.0" y="243" text-anchor="middle">long-poll → track_ending</text><circle class="stepdot" cx="374" cy="252" r="0"/></g><g class="msg" data-step="3"><path class="e link" d="M626,312 H134" marker-end="url(#ah)"/><rect class="alm" x="419.7" y="292" width="160.7" height="14" rx="2"/><text class="al" x="500" y="303" text-anchor="middle">command: state  (vía /poll)</text><circle class="stepdot" cx="134" cy="312" r="0"/></g><g class="msg" data-step="3"><path class="e link dash" d="M134,340 H626" marker-end="url(#ah)"/><rect class="alm" x="439.2" y="320" width="121.6" height="14" rx="2"/><text class="al" x="500" y="331" text-anchor="middle">estado: decks · cola</text><circle class="stepdot" cx="134" cy="340" r="0"/></g><g class="msg" data-step="4"><path class="e " d="M634,410 H876" marker-end="url(#ah)"/><rect class="alm" x="666.3" y="390" width="177.4" height="14" rx="2"/><text class="al" x="755.0" y="401" text-anchor="middle">prompt: BPM · tonalidad · bajo</text><circle class="stepdot" cx="634" cy="410" r="0"/></g><g class="msg" data-step="5"><path class="e dash" d="M876,462 H634" marker-end="url(#ah)"/><rect class="alm" x="669.1" y="442" width="171.8" height="14" rx="2"/><text class="al" x="755.0" y="453" text-anchor="middle">JSON: fade · eq · fx · filtro</text><circle class="stepdot" cx="634" cy="462" r="0"/></g><g class="msg" data-step="6"><path class="e link" d="M626,530 H134" marker-end="url(#ah)"/><rect class="alm" x="428.0" y="510" width="143.9" height="14" rx="2"/><text class="al" x="500" y="521" text-anchor="middle">plan_transition(from_id)</text><circle class="stepdot" cx="134" cy="530" r="0"/></g><g class="msg" data-step="7"><path class="e link" d="M134,590 H366" marker-end="url(#ah)"/><rect class="alm" x="161.3" y="570" width="177.4" height="14" rx="2"/><text class="al" x="250.0" y="581" text-anchor="middle">POST /event · transition_start</text><circle class="stepdot" cx="134" cy="590" r="0"/></g><g class="msg" data-step="1"><circle cx="104" cy="196" r="9" class="badge"/><text class="bt" x="104" y="199.5" text-anchor="middle">1</text></g><g class="msg" data-step="2"><circle cx="344" cy="252" r="9" class="badge"/><text class="bt" x="344" y="255.5" text-anchor="middle">2</text></g><g class="msg" data-step="3"><circle cx="656" cy="312" r="9" class="badge"/><text class="bt" x="656" y="315.5" text-anchor="middle">3</text></g><g class="msg" data-step="4"><circle cx="604" cy="410" r="9" class="badge"/><text class="bt" x="604" y="413.5" text-anchor="middle">4</text></g><g class="msg" data-step="5"><circle cx="906" cy="462" r="9" class="badge"/><text class="bt" x="906" y="465.5" text-anchor="middle">5</text></g><g class="msg" data-step="6"><circle cx="656" cy="530" r="9" class="badge"/><text class="bt" x="656" y="533.5" text-anchor="middle">6</text></g><g class="msg" data-step="7"><circle cx="104" cy="590" r="9" class="badge"/><text class="bt" x="104" y="593.5" text-anchor="middle">7</text></g></svg>