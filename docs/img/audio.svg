<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" width="1000" height="530" role="img" aria-labelledby="aut aud" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif"><title id="aut">Cadena de audio</title><desc id="aud">Archivo, filtros y EQ, fader, efectos post-fader, trim, master, compresor y salida a altavoces y grabación.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="context-stroke" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker><style>
.bg{fill:#080b0b}
.zone{fill:rgba(237,241,233,.02);stroke:rgba(237,241,233,.11);stroke-width:.8}
.zl{font:500 8.5px ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;letter-spacing:.14em;fill:#7f8b84}
.n rect{fill:#0f1413;stroke:#3a4640;stroke-width:1}
.n.focal rect{fill:rgba(202,255,26,.08);stroke:#caff1a;stroke-width:1.4}
.n.ext rect,.n.opt rect{stroke-dasharray:4 3}
.n{cursor:default}
.div{stroke:rgba(237,241,233,.10);stroke-width:1}
.nn{font:600 13px system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;fill:#edf1e9}
.ns{font:400 10px ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;fill:#a3aea6}
.e{fill:none;stroke:#7f8b84;stroke-width:1.2}
.e.link{stroke:#8ab4e8}
.e.dash{stroke-dasharray:4 3;stroke-width:1}
.alm{fill:#080b0b}
.al{font:400 9px ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;letter-spacing:.04em;fill:#a3aea6}
.eb{font:500 8.5px ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;letter-spacing:.16em;fill:#7f8b84}
.tit{font:400 22px Georgia,'Times New Roman',serif;fill:#edf1e9}
.sub{font:400 11px ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;fill:#a3aea6}
.note{font:italic 400 13px Georgia,'Times New Roman',serif;fill:#a3aea6}
@media (prefers-reduced-motion:reduce){.tok{display:none}}
</style></defs><rect class="bg" width="1000" height="530"/><text class="eb" x="32" y="34">CADENA DE AUDIO</text><text class="tit" x="32" y="62">De archivo a altavoces</text><text class="sub" x="32" y="82">La cadena de audio de cada deck y la salida común.</text><rect class="zone" x="16" y="124" width="968" height="150" rx="8"/><rect class="alm" x="28" y="117" width="223" height="14" rx="2"/><text class="zl" x="34" y="127">CADA DECK · A Y B TIENEN SU PROPIA COPIA</text><rect class="zone" x="16" y="338" width="968" height="160" rx="8"/><rect class="alm" x="28" y="331" width="75" height="14" rx="2"/><text class="zl" x="34" y="341">SALIDA COMÚN</text><path id="c1" class="e " d="M254,200 H294" marker-end="url(#ah)"/><path id="c2" class="e " d="M526,200 H566" marker-end="url(#ah)"/><path id="c3" class="e " d="M726,200 H766" marker-end="url(#ah)"/><path id="c4" class="e dash" d="M889,244 V298 Q889,306 881,306 H135 Q127,306 127,314 V392" marker-end="url(#ah)"/><g class="al-g" data-edge="c4"><rect class="alm" x="397.0" y="298" width="222.0" height="14" rx="2"/><text class="al" x="508" y="309" text-anchor="middle">los efectos se suman después del fader</text></g><path id="c5" class="e " d="M254,423 H294" marker-end="url(#ah)"/><path id="c6" class="e " d="M466,423 H506" marker-end="url(#ah)"/><path id="c7" class="e " d="M736,413 H748 Q756,413 756,405 V406 Q756,398 764,398 H776" marker-end="url(#ah)"/><path id="c8" class="e " d="M736,433 H748 Q756,433 756,441 V460 Q756,468 764,468 H776" marker-end="url(#ah)"/><g class="n focal" data-id="file" data-edges="c1" tabindex="0" role="button" aria-label="Archivo local"><rect x="32" y="160" width="222" height="84" rx="6"/><text class="nn" x="44" y="182">Archivo local</text><text class="ns" x="44" y="200">MP3 · WAV · FLAC</text><text class="ns" x="44" y="215">&lt;audio&gt; del navegador</text></g><g class="n " data-id="eq" data-edges="c1,c2" tabindex="0" role="button" aria-label="Filtros y EQ"><rect x="294" y="160" width="232" height="84" rx="6"/><text class="nn" x="306" y="182">Filtros y EQ</text><text class="ns" x="306" y="200">HP 20 Hz · LP 19 kHz</text><text class="ns" x="306" y="215">Low 180 · Mid 1.1k · High 5.5k</text></g><g class="n " data-id="fader" data-edges="c2,c3" tabindex="0" role="button" aria-label="Fader del deck"><rect x="566" y="160" width="160" height="84" rx="6"/><text class="nn" x="578" y="182">Fader del deck</text><text class="ns" x="578" y="200">gain por deck</text><text class="ns" x="578" y="215">crossfader A ↔ B</text></g><g class="n opt" data-id="fx" data-edges="c3,c4" tabindex="0" role="button" aria-label="Efectos"><rect x="766" y="160" width="202" height="84" rx="6"/><text class="nn" x="778" y="182">Efectos</text><text class="ns" x="778" y="200">eco · reverb · flanger</text><text class="ns" x="778" y="215">post-fader</text></g><g class="n " data-id="trim" data-edges="c4,c5" tabindex="0" role="button" aria-label="Trim · auto-gain"><rect x="32" y="392" width="222" height="62" rx="6"/><text class="nn" x="44" y="414">Trim · auto-gain</text><text class="ns" x="44" y="432">iguala los volúmenes</text></g><g class="n " data-id="master" data-edges="c5,c6" tabindex="0" role="button" aria-label="Master"><rect x="294" y="392" width="172" height="62" rx="6"/><text class="nn" x="306" y="414">Master</text><text class="ns" x="306" y="432">ganancia 0.82</text></g><g class="n focal" data-id="comp" data-edges="c6,c7,c8" tabindex="0" role="button" aria-label="Compresor"><rect x="506" y="392" width="230" height="62" rx="6"/><text class="nn" x="518" y="414">Compresor</text><text class="ns" x="518" y="432">umbral −4 dB · 16:1</text></g><g class="n " data-id="spk" data-edges="c7" tabindex="0" role="button" aria-label="Altavoces"><rect x="776" y="378" width="192" height="40" rx="6"/><text class="nn" x="788" y="400">Altavoces</text></g><g class="n opt" data-id="rec" data-edges="c8" tabindex="0" role="button" aria-label="Grabación del set"><rect x="776" y="448" width="192" height="40" rx="6"/><text class="nn" x="788" y="470">Grabación del set</text></g><path id="flow" d="M40,202 H845 V306 H127 V423 H760" fill="none" stroke="none"/><circle class="tok" r="3.6" fill="#caff1a"><animateMotion dur="7.5s" begin="0s" repeatCount="indefinite" calcMode="linear"><mpath href="#flow"/></animateMotion></circle></svg>