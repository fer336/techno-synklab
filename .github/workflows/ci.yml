name: CI

# Fast feedback on branches and pull requests. It never builds release images or deploys.
on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Production stack is valid and pinned (no floating tags)
        run: |
          grep -E '^\s+image: ' docker-compose.yml
          if grep -E 'image: .*:(latest|stable)\s*$' docker-compose.yml; then echo "::error::floating tag in docker-compose.yml"; exit 1; fi
      - name: Dockerfile builds
        run: docker build --build-arg APP_VERSION=ci -t synklab-ci .
